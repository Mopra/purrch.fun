# Everything that can be checked without a person, a microphone or a keychain.
#
# Runs on Windows only, deliberately: Purrch is a Windows app — the persona
# names PowerShell, the ears are a Windows speech engine, the bundle is an NSIS
# installer — and a green tick from a Linux runner would be checking a
# configuration nobody ships.
#
# What this does NOT cover, and RELEASING.md repeats: the `--ignored` tests
# (microphone, OS keychain), and whether a cat actually appears on the taskbar.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes the previous run's answer irrelevant, and Windows runners
# are slow enough that queueing them up costs real time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Keyed on the lockfile *and* on the manifest: a feature flag change
      # rebuilds the world without changing a single version number.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}

      - run: npm ci

      # Before the Rust build: `tauri.conf.json` points `frontendDist` at
      # `../dist`, so `cargo` needs it to exist even to compile.
      - name: build the frontend
        run: npm run build

      - name: typecheck
        run: npm run check

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --lib --tests -- -D warnings

      - name: test
        working-directory: src-tauri
        run: cargo test --lib

  # Proves the thing users actually download still builds. Separate job so a
  # typecheck failure reports in seconds rather than after a full link.
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundle-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}

      - run: npm ci

      # No signing key here on purpose. CI checks that it *builds*; a signed
      # artifact only comes out of the release workflow, from a tag.
      - name: build the installer
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: purrch-nsis-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          # An untagged build is only worth keeping long enough to try it.
          retention-days: 7
