[package]
name = "purrch"
version = "0.1.0"
description = "A pixel cat that keeps you company on your desktop"
edition = "2021"

[lib]
name = "purrch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what keeps the colony reachable: every cat window skips the
# taskbar, so without it a user who sends the last one home has nothing left to
# click.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
# Bring-your-own API keys go to the OS credential store rather than to disk.
# Default features cover the Windows, Apple and secret-service backends.
keyring = "4"
# A windowed app has nowhere for `eprintln!` to go, so "my cat stopped working"
# had no evidence behind it. See `diag.rs`.
log = "0.4"
tauri-plugin-log = "2.9.0"
# The chores premise is "your PC is already on" — which only holds if Purrch is
# running without being launched by hand every morning.
tauri-plugin-autostart = "2.5.1"
# The Claude Code adapter is pinned to a JSONL schema that can change under us.
# Without a way to ship a fix, that would be a silent, permanent break.
tauri-plugin-updater = "2.10.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
