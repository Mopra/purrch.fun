[package]
name = "purrch"
version = "0.1.0"
description = "A pixel cat that keeps you company on your desktop"
edition = "2021"

[lib]
name = "purrch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
# Bring-your-own API keys go to the OS credential store rather than to disk.
# Default features cover the Windows, Apple and secret-service backends.
keyring = "4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
